<!doctype html>
<html>
  <head>
    <title>Metrics</title>
  </head>
  <body>
    <h1>Metrics</h1>
    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Name</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody>
        {{ range . }}
        <tr>
          <td>{{ .MType }}</td>
          <td>{{ .ID }}</td>
          <td>{{ .GetValue }}</td>
        </tr>
        {{ else }}
        <tr>
          <td colspan="3">Нет данных</td>
        </tr>
        {{ end }}
      </tbody>
    </table>
  </body>
</html>
